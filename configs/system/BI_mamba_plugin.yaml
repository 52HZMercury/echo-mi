_target_: src.systems.BI_mamba_system.BIMambaSystem
model_cfg:
  _target_: src.models.BI_mamba_plugin_model.BIMambaPlugin
  in_chans: 3
  num_outputs: 1
  embed_dim: 192
  depth: 6
  patch_size: [2, 16, 16]
  d_state: 16
  d_conv: 4
  expand: 2
  bimamba_type: v3
  nslices: 8
  dropout_rate: 0.2
  enable_dk_ac: true
  video_encoder_path: "./model_weight/echo_prime_encoder.pt"
  text_encoder_path: "./model_weight/echo_prime_text_encoder.pt"
  frozen_video_encoder: true
  frozen_text_encoder: true
learning_rate: 1e-5
loss_type: bce
